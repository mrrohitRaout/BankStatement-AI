<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - BankStatement AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .glass-card {
        background: rgba(52, 73, 94, 0.95);
        backdrop-filter: blur(15px);
        border: 3px solid rgba(94, 234, 212, 0.4);
        box-shadow: 0 0 40px rgba(94, 234, 212, 0.25), 0 0 80px rgba(94, 234, 212, 0.1);
      }
      .btn-primary {
        background: linear-gradient(135deg, #14b8a6, #0d9488);
        box-shadow: 0 0 20px rgba(94, 234, 212, 0.4), 0 0 40px rgba(94, 234, 212, 0.2);
        border: 1px solid rgba(94, 234, 212, 0.3);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(94, 234, 212, 0.6), 0 8px 25px rgba(20, 184, 166, 0.4);
      }
      input:focus {
        border-color: rgba(94, 234, 212, 0.6);
        box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.1);
      }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);">
    <div class="glass-card rounded-2xl shadow-lg px-8 py-10 w-full max-w-md">
        <div class="flex items-center justify-center gap-3 mb-6">
            <div class="w-12 h-12 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%); box-shadow: 0 0 20px rgba(94, 234, 212, 0.5);">
                <i class="fas fa-file-invoice-dollar text-white text-2xl"></i>
            </div>
            <h2 class="text-3xl font-bold text-white">StatementAI</h2>
        </div>
        <h3 class="text-2xl font-bold text-white mb-6 text-center">Create Your Account</h3>
        <form id="register-form" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-semibold mb-2" style="color: #cbd5e1;">Full Name</label>
                <input type="text" id="name" name="name" required class="w-full px-4 py-3 rounded-lg transition-all duration-300" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.3); color: #ffffff;" placeholder="Your Name">
            </div>
            <div>
                <label for="email" class="block text-sm font-semibold mb-2" style="color: #cbd5e1;">Email Address</label>
                <input type="email" id="email" name="email" required class="w-full px-4 py-3 rounded-lg transition-all duration-300" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.3); color: #ffffff;" placeholder="user@example.com">
            </div>
            <div>
                <label for="password" class="block text-sm font-semibold mb-2" style="color: #cbd5e1;">Password</label>
                <input type="password" id="password" name="password" required minlength="6" class="w-full px-4 py-3 rounded-lg transition-all duration-300" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.3); color: #ffffff;" placeholder="Create a password">
            </div>
            <div>
                <label for="confirm-password" class="block text-sm font-semibold mb-2" style="color: #cbd5e1;">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required minlength="6" class="w-full px-4 py-3 rounded-lg transition-all duration-300" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.3); color: #ffffff;" placeholder="Re-enter your password">
            </div>
            <div id="error-message" class="text-sm hidden mb-2" style="color: #fca5a5; background: rgba(239, 68, 68, 0.1); padding: 0.75rem; border-radius: 0.5rem;"></div>
            <button type="submit" class="btn-primary w-full text-white px-6 py-4 rounded-xl font-bold mt-2 transition-all duration-300 hover:scale-105 flex items-center justify-center gap-2">
                <i class="fas fa-user-plus"></i>
                <span>Create Account</span>
            </button>
        </form>
        <div class="mt-5 text-center text-sm" style="color: #94a3b8;">
            Already have an account?
            <a href="login.html" class="font-bold transition-colors duration-300" style="color: #5eead4;" onmouseover="this.style.color='#14b8a6'" onmouseout="this.style.color='#5eead4'">Sign in</a>
        </div>
        <div class="mt-5 text-center">
            <a href="index.html" class="text-sm font-medium transition-colors duration-300" style="color: #94a3b8;" onmouseover="this.style.color='#cbd5e1'" onmouseout="this.style.color='#94a3b8'">
                <i class="fas fa-arrow-left mr-2"></i>Back to Home
            </a>
        </div>
    </div>
    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            var confirm = document.getElementById('confirm-password').value;
            var errorMessage = document.getElementById('error-message');
            errorMessage.classList.add('hidden');

            if (!name || !email || !password || !confirm) {
                errorMessage.textContent = 'All fields are required.';
                errorMessage.classList.remove('hidden');
            } else if (password.length < 6) {
                errorMessage.textContent = 'Password must be at least 6 characters.';
                errorMessage.classList.remove('hidden');
            } else if (password !== confirm) {
                errorMessage.textContent = 'Passwords do not match.';
                errorMessage.classList.remove('hidden');
            } else {
                // Simulate registration (replace with AJAX/back-end call)
                // Mark that this is a newly registered user who has not yet activated a subscription
                try{
                    // store a simple user record in localStorage for demo purposes
                    const demoUser = { name: name, email: email, createdAt: new Date().toISOString(), subscribed: false, seenPricingModal: false };
                    localStorage.setItem('bsai_user', JSON.stringify(demoUser));
                    // redirect to homepage (index.html) after registration
                    window.location.href = 'index.html';
                }catch(e){
                    // fallback redirect
                    window.location.href = 'index.html';
                }
            }
        });
    </script>
</body>
</html>
