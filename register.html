<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - BankStatement AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .glass-card {
        background: rgba(255,255,255,0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.2);
        box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      }
      .btn-primary {
        background: linear-gradient(135deg, #4a90e2, #17a2b8);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(74,144,226,0.4);
      }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-700 to-teal-400">
    <div class="glass-card rounded-2xl shadow-lg px-8 py-12 w-full max-w-md">
        <h2 class="text-3xl font-bold text-gray-900 mb-6 text-center">Create Your Account</h2>
        <form id="register-form" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
                <input type="text" id="name" name="name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Your Name">
            </div>
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                <input type="email" id="email" name="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="user@example.com">
            </div>
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                <input type="password" id="password" name="password" required minlength="6" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Create a password">
            </div>
            <div>
                <label for="confirm-password" class="block text-sm font-semibold text-gray-700 mb-2">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required minlength="6" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Re-enter your password">
            </div>
            <div id="error-message" class="text-red-600 text-sm hidden mb-2"></div>
            <button type="submit" class="btn-primary w-full text-white px-6 py-3 rounded-lg font-semibold mt-2">
                Create Account
            </button>
        </form>
        <div class="mt-4 text-center text-sm text-gray-500">
            Already have an account?
            <a href="login.html" class="text-blue-500 hover:underline font-medium">Sign in</a>
        </div>
    </div>
    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            var confirm = document.getElementById('confirm-password').value;
            var errorMessage = document.getElementById('error-message');
            errorMessage.classList.add('hidden');

            if (!name || !email || !password || !confirm) {
                errorMessage.textContent = 'All fields are required.';
                errorMessage.classList.remove('hidden');
            } else if (password.length < 6) {
                errorMessage.textContent = 'Password must be at least 6 characters.';
                errorMessage.classList.remove('hidden');
            } else if (password !== confirm) {
                errorMessage.textContent = 'Passwords do not match.';
                errorMessage.classList.remove('hidden');
            } else {
                // Simulate registration (replace with AJAX/back-end call)
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
