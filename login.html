<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - BankStatement AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .glass-card {
        background: rgba(52, 73, 94, 0.95);
        backdrop-filter: blur(15px);
        border: 3px solid rgba(94, 234, 212, 0.4);
        box-shadow: 0 0 40px rgba(94, 234, 212, 0.25), 0 0 80px rgba(94, 234, 212, 0.1);
      }
      .btn-primary {
        background: linear-gradient(135deg, #14b8a6, #0d9488);
        box-shadow: 0 0 20px rgba(94, 234, 212, 0.4), 0 0 40px rgba(94, 234, 212, 0.2);
        border: 1px solid rgba(94, 234, 212, 0.3);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(94, 234, 212, 0.6), 0 8px 25px rgba(20, 184, 166, 0.4);
      }
      input:focus {
        border-color: rgba(94, 234, 212, 0.6);
        box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.1);
      }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);">
    <div class="glass-card rounded-2xl shadow-lg px-8 py-12 w-full max-w-md">
        <div class="flex items-center justify-center gap-3 mb-8">
            <div class="w-12 h-12 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%); box-shadow: 0 0 20px rgba(94, 234, 212, 0.5);">
                <i class="fas fa-file-invoice-dollar text-white text-2xl"></i>
            </div>
            <h2 class="text-3xl font-bold text-white">StatementAI</h2>
        </div>
        <h3 class="text-2xl font-bold text-white mb-6 text-center">Welcome Back</h3>
        <form id="login-form" class="space-y-5">
            <div>
                <label for="email" class="block text-sm font-semibold mb-2" style="color: #cbd5e1;">Email Address</label>
                <input type="email" id="email" name="email" required class="w-full px-4 py-3 rounded-lg transition-all duration-300" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.3); color: #ffffff;" placeholder="user@example.com">
            </div>
            <div>
                <label for="password" class="block text-sm font-semibold mb-2" style="color: #cbd5e1;">Password</label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-3 rounded-lg transition-all duration-300" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.3); color: #ffffff;" placeholder="Enter your password">
            </div>
            <div id="error-message" class="text-sm hidden mb-2" style="color: #fca5a5; background: rgba(239, 68, 68, 0.1); padding: 0.75rem; border-radius: 0.5rem;"></div>
            <button type="submit" class="btn-primary w-full text-white px-6 py-4 rounded-xl font-bold mt-2 transition-all duration-300 hover:scale-105 flex items-center justify-center gap-2">
                <i class="fas fa-sign-in-alt"></i>
                <span>Sign In</span>
            </button>
        </form>
        <div class="mt-6 text-center">
            <a href="#" class="font-medium transition-colors duration-300" style="color: #5eead4;" onmouseover="this.style.color='#14b8a6'" onmouseout="this.style.color='#5eead4'">Forgot password?</a>
        </div>
        <div class="mt-4 text-center text-sm" style="color: #94a3b8;">
            New to StatementAI?
            <a href="register.html" class="font-bold transition-colors duration-300" style="color: #5eead4;" onmouseover="this.style.color='#14b8a6'" onmouseout="this.style.color='#5eead4'">Create account</a>
        </div>
        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm font-medium transition-colors duration-300" style="color: #94a3b8;" onmouseover="this.style.color='#cbd5e1'" onmouseout="this.style.color='#94a3b8'">
                <i class="fas fa-arrow-left mr-2"></i>Back to Home
            </a>
        </div>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            var errorMessage = document.getElementById('error-message');
            errorMessage.classList.add('hidden');
            if (email === '' || password === '') {
                errorMessage.textContent = 'Please fill in all fields.';
                errorMessage.classList.remove('hidden');
            } else {
                // Simulate authentication, replace with real backend API logic
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
