<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - BankStatement AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(52, 73, 94, 0.9);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(94, 234, 212, 0.3);
            box-shadow: 0 0 30px rgba(94, 234, 212, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            box-shadow: 0 0 15px rgba(94, 234, 212, 0.4);
            border: 1px solid rgba(94, 234, 212, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(94, 234, 212, 0.6);
        }
    </style>
</head>
<body class="min-h-screen" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);">
    <nav class="glass-card py-4 px-6 flex items-center justify-between max-w-5xl mx-auto mt-8 rounded-xl">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%); box-shadow: 0 0 15px rgba(94, 234, 212, 0.5);">
                <i class="fas fa-file-invoice-dollar text-white text-lg"></i>
            </div>
            <span class="text-xl font-bold text-white">StatementAI</span>
        </div>
        <div class="space-x-6 flex items-center">
            <a href="index.html" class="font-medium transition-colors duration-300" style="color: #cbd5e1;" onmouseover="this.style.color='#5eead4'" onmouseout="this.style.color='#cbd5e1'">Home</a>
            <a href="dashboard.html" class="font-bold transition-colors duration-300" style="color: #5eead4;">Dashboard</a>
            <a href="profile.html" class="font-medium transition-colors duration-300" style="color: #cbd5e1;" onmouseover="this.style.color='#5eead4'" onmouseout="this.style.color='#cbd5e1'">Profile</a>
            <a href="settings.html" class="font-medium transition-colors duration-300" style="color: #cbd5e1;" onmouseover="this.style.color='#5eead4'" onmouseout="this.style.color='#cbd5e1'">Settings</a>
            <button onclick="logout()" class="font-medium transition-colors duration-300" style="color: #fca5a5;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#fca5a5'">
                <i class="fas fa-sign-out-alt mr-1"></i>Logout
            </button>
        </div>
    </nav>
    <main class="max-w-4xl mx-auto py-16 px-4">
        <div class="glass-card rounded-2xl p-10 text-center">
            <div class="mb-6">
                <div class="w-20 h-20 mx-auto mb-4 rounded-2xl flex items-center justify-center" style="background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%); box-shadow: 0 0 30px rgba(94, 234, 212, 0.5);">
                    <i class="fas fa-chart-line text-white text-4xl"></i>
                </div>
            </div>
            <h1 class="text-4xl font-black text-white mb-4">Welcome to your Dashboard</h1>
            <p class="mb-8 text-lg" style="color: #cbd5e1;">
                Here you can upload new bank statements, view smart analytics, and manage your account.
            </p>
            <div class="flex flex-col sm:flex-row justify-center gap-4 mb-8">
                <a href="index.html#upload-section" class="btn-primary text-white px-8 py-4 rounded-xl font-bold transition-all duration-300 hover:scale-105 flex items-center justify-center gap-2">
                    <i class="fas fa-upload"></i>
                    <span>Upload Statements</span>
                </a>
                <a href="index.html#analytics" onclick="alert('Process a file first to see analytics!')" class="px-8 py-4 rounded-xl font-bold text-white transition-all duration-300 hover:scale-105 flex items-center justify-center gap-2" style="background: rgba(72, 85, 99, 0.8); border: 2px solid rgba(94, 234, 212, 0.3);">
                    <i class="fas fa-chart-bar"></i>
                    <span>View Analytics</span>
                </a>
            </div>
            <div class="grid grid-cols-3 gap-4 max-w-2xl mx-auto mt-10">
                <div class="p-4 rounded-xl" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.2);">
                    <div class="text-3xl font-black text-white mb-1">AI</div>
                    <div class="text-xs" style="color: #94a3b8;">Powered</div>
                </div>
                <div class="p-4 rounded-xl" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.2);">
                    <div class="text-3xl font-black text-white mb-1">Secure</div>
                    <div class="text-xs" style="color: #94a3b8;">Bank-level</div>
                </div>
                <div class="p-4 rounded-xl" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.2);">
                    <div class="text-3xl font-black text-white mb-1">Fast</div>
                    <div class="text-xs" style="color: #94a3b8;">Instant</div>
                </div>
            </div>
            <div class="text-sm mt-10" style="color: #64748b;">
                &copy; 2025 StatementAI - All rights reserved
            </div>
        </div>
    </main>
    <script>
        function logout() {
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
