<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile - BankStatement AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(52, 73, 94, 0.9);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(94, 234, 212, 0.3);
            box-shadow: 0 0 30px rgba(94, 234, 212, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            box-shadow: 0 0 15px rgba(94, 234, 212, 0.4);
            border: 1px solid rgba(94, 234, 212, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(94, 234, 212, 0.6);
        }
        input:focus, textarea:focus {
            border-color: rgba(94, 234, 212, 0.6);
            box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.1);
        }
    </style>
</head>
<body class="min-h-screen" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);">
    <!-- Navigation -->
    <nav class="glass-card py-4 px-6 flex items-center justify-between max-w-6xl mx-auto mt-8 rounded-xl">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%); box-shadow: 0 0 15px rgba(94, 234, 212, 0.5);">
                <i class="fas fa-file-invoice-dollar text-white text-lg"></i>
            </div>
            <span class="text-xl font-bold text-white">StatementAI</span>
        </div>
        <div class="space-x-6 flex items-center">
            <a href="index.html" class="font-medium transition-colors duration-300" style="color: #cbd5e1;" onmouseover="this.style.color='#5eead4'" onmouseout="this.style.color='#cbd5e1'">Home</a>
            <a href="dashboard.html" class="font-medium transition-colors duration-300" style="color: #cbd5e1;" onmouseover="this.style.color='#5eead4'" onmouseout="this.style.color='#cbd5e1'">Dashboard</a>
            <a href="profile.html" class="font-bold transition-colors duration-300" style="color: #5eead4;">Profile</a>
            <a href="settings.html" class="font-medium transition-colors duration-300" style="color: #cbd5e1;" onmouseover="this.style.color='#5eead4'" onmouseout="this.style.color='#cbd5e1'">Settings</a>
            <button onclick="logout()" class="font-medium transition-colors duration-300" style="color: #fca5a5;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#fca5a5'">
                <i class="fas fa-sign-out-alt mr-1"></i>Logout
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto py-12 px-4">
        <div class="glass-card rounded-2xl p-8">
            <!-- Header -->
            <div class="flex items-center gap-6 mb-8 pb-6 border-b" style="border-color: rgba(94, 234, 212, 0.2);">
                <div class="w-24 h-24 rounded-full flex items-center justify-center text-4xl font-black text-white" style="background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%); box-shadow: 0 0 30px rgba(94, 234, 212, 0.5);">
                    <span id="user-initials">U</span>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-white mb-2" id="user-name">Loading...</h1>
                    <p class="text-lg" style="color: #cbd5e1;" id="user-email">Loading...</p>
                    <div class="mt-2 flex items-center gap-2">
                        <span class="px-3 py-1 rounded-full text-xs font-bold" style="background: rgba(94, 234, 212, 0.2); color: #5eead4;" id="user-plan">FREE</span>
                        <span class="text-sm" style="color: #94a3b8;">Member since <span id="member-since">2025</span></span>
                    </div>
                </div>
            </div>

            <!-- Profile Form -->
            <form id="profile-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold mb-2" style="color: #cbd5e1;">Full Name</label>
                        <input type="text" id="name" required class="w-full px-4 py-3 rounded-lg transition-all duration-300" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.3); color: #ffffff;" placeholder="Your Name">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2" style="color: #cbd5e1;">Email Address</label>
                        <input type="email" id="email" required class="w-full px-4 py-3 rounded-lg transition-all duration-300" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.3); color: #ffffff;" placeholder="user@example.com">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold mb-2" style="color: #cbd5e1;">Phone Number</label>
                        <input type="tel" id="phone" class="w-full px-4 py-3 rounded-lg transition-all duration-300" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.3); color: #ffffff;" placeholder="+1 (555) 123-4567">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2" style="color: #cbd5e1;">Company</label>
                        <input type="text" id="company" class="w-full px-4 py-3 rounded-lg transition-all duration-300" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.3); color: #ffffff;" placeholder="Your Company">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2" style="color: #cbd5e1;">Address</label>
                    <input type="text" id="address" class="w-full px-4 py-3 rounded-lg transition-all duration-300" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.3); color: #ffffff;" placeholder="Your Address">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2" style="color: #cbd5e1;">Bio</label>
                    <textarea id="bio" rows="4" class="w-full px-4 py-3 rounded-lg transition-all duration-300" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.3); color: #ffffff;" placeholder="Tell us about yourself..."></textarea>
                    <p class="text-xs mt-1" style="color: #94a3b8;">Maximum 500 characters</p>
                </div>

                <div id="message" class="text-sm hidden mb-2"></div>

                <div class="flex gap-4">
                    <button type="submit" class="btn-primary text-white px-8 py-4 rounded-xl font-bold transition-all duration-300 hover:scale-105 flex items-center justify-center gap-2">
                        <i class="fas fa-save"></i>
                        <span>Save Changes</span>
                    </button>
                    <button type="button" onclick="loadProfile()" class="px-8 py-4 rounded-xl font-bold text-white transition-all duration-300 hover:scale-105" style="background: rgba(72, 85, 99, 0.8); border: 2px solid rgba(94, 234, 212, 0.3);">
                        <i class="fas fa-undo mr-2"></i>Reset
                    </button>
                </div>
            </form>

            <!-- Usage Stats -->
            <div class="mt-10 pt-8 border-t" style="border-color: rgba(94, 234, 212, 0.2);">
                <h2 class="text-xl font-bold text-white mb-4">Usage Statistics</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="p-4 rounded-xl" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.2);">
                        <div class="text-2xl font-black text-white mb-1" id="files-processed">0</div>
                        <div class="text-sm" style="color: #94a3b8;">Files Processed</div>
                    </div>
                    <div class="p-4 rounded-xl" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.2);">
                        <div class="text-2xl font-black text-white mb-1" id="account-status">Active</div>
                        <div class="text-sm" style="color: #94a3b8;">Account Status</div>
                    </div>
                    <div class="p-4 rounded-xl" style="background: rgba(72, 85, 99, 0.6); border: 2px solid rgba(94, 234, 212, 0.2);">
                        <div class="text-2xl font-black text-white mb-1" id="subscription-plan">Free</div>
                        <div class="text-sm" style="color: #94a3b8;">Subscription Plan</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Check authentication
        const token = localStorage.getItem('authToken');
        if (!token) {
            window.location.href = 'login.html';
        }

        // Load user profile
        async function loadProfile() {
            try {
                const response = await fetch('http://localhost:3002/api/profile', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (data.success) {
                    const user = data.user;
                    
                    // Update header
                    document.getElementById('user-name').textContent = user.name;
                    document.getElementById('user-email').textContent = user.email;
                    document.getElementById('user-initials').textContent = user.name.charAt(0).toUpperCase();
                    document.getElementById('user-plan').textContent = user.subscription.plan.toUpperCase();
                    
                    const memberSince = new Date(user.createdAt).getFullYear();
                    document.getElementById('member-since').textContent = memberSince;
                    
                    // Fill form
                    document.getElementById('name').value = user.name || '';
                    document.getElementById('email').value = user.email || '';
                    document.getElementById('phone').value = user.phone || '';
                    document.getElementById('company').value = user.company || '';
                    document.getElementById('address').value = user.address || '';
                    document.getElementById('bio').value = user.bio || '';
                    
                    // Update stats
                    document.getElementById('files-processed').textContent = user.usage?.filesProcessed || 0;
                    document.getElementById('account-status').textContent = user.subscription.status.charAt(0).toUpperCase() + user.subscription.status.slice(1);
                    document.getElementById('subscription-plan').textContent = user.subscription.plan.charAt(0).toUpperCase() + user.subscription.plan.slice(1);
                } else {
                    showMessage(data.message || 'Failed to load profile', 'error');
                }
            } catch (error) {
                console.error('Load profile error:', error);
                showMessage('Error loading profile', 'error');
            }
        }

        // Save profile
        document.getElementById('profile-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const profileData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                company: document.getElementById('company').value,
                address: document.getElementById('address').value,
                bio: document.getElementById('bio').value
            };

            try {
                const response = await fetch('http://localhost:3002/api/profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(profileData)
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('Profile updated successfully!', 'success');
                    loadProfile(); // Reload profile
                } else {
                    showMessage(data.message || 'Failed to update profile', 'error');
                }
            } catch (error) {
                console.error('Update profile error:', error);
                showMessage('Error updating profile', 'error');
            }
        });

        function showMessage(msg, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = msg;
            messageEl.className = 'text-sm mb-2 p-3 rounded-lg';
            
            if (type === 'success') {
                messageEl.style.color = '#10b981';
                messageEl.style.background = 'rgba(16, 185, 129, 0.1)';
            } else {
                messageEl.style.color = '#fca5a5';
                messageEl.style.background = 'rgba(239, 68, 68, 0.1)';
            }
            
            messageEl.classList.remove('hidden');
            setTimeout(() => messageEl.classList.add('hidden'), 5000);
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // Load profile on page load
        loadProfile();
    </script>
</body>
</html>
